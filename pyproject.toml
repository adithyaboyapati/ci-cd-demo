# pyproject.toml — Project Configuration
# =========================================
#
# WHY PYPROJECT.TOML?
# Modern Python tooling converges on pyproject.toml as the single config file.
# Previously you needed: setup.py + setup.cfg + tox.ini + .coveragerc + ...
# Now: one file to rule them all.
#
# CI/CD RELEVANCE:
# The [tool.pytest.ini_options] and [tool.coverage] sections control
# exactly how tests and coverage are measured in the CI pipeline.
# This means local runs and CI runs behave identically — no surprises.

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ci-cd-demo"
version = "0.1.0"
description = "A demo Flask app to learn CI/CD pipelines"
requires-python = ">=3.11"
readme = "README.md"

# =============================================================================
# pytest configuration
# =============================================================================
[tool.pytest.ini_options]

# WHERE TO FIND TESTS
testpaths = ["tests"]

# VERBOSITY: -v shows each test name and pass/fail
# This is important in CI — you need to know exactly which test failed
addopts = [
    "-v",
    "--tb=short",              # Short tracebacks — easier to read in CI logs
    "--cov=app",               # Measure coverage for the app/ directory
    "--cov-report=term-missing", # Show uncovered lines in CI output
    "--cov-report=html:htmlcov", # Generate HTML report (can be saved as CI artifact)
    "--cov-fail-under=80",     # FAIL the build if coverage drops below 80%
]

# =============================================================================
# Coverage configuration
# =============================================================================
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__init__.py",  # Factory file — typically excluded from coverage
]

[tool.coverage.report]
# Lines that don't need to be covered (pragmatic exclusions)
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
