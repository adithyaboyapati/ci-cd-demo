# =============================================================================
# .github/workflows/ci.yml — Continuous Integration Pipeline
# =============================================================================
#
# ┌─────────────────────────────────────────────────────────┐
# │  WHAT IS CONTINUOUS INTEGRATION?                        │
# │                                                         │
# │  CI = "Every code change is automatically verified      │
# │  against the full test suite before it can be merged."  │
# │                                                         │
# │  The three promises CI makes:                           │
# │  1. Your code compiles/runs in a clean environment      │
# │  2. All tests pass                                      │
# │  3. Code meets quality standards                        │
# └─────────────────────────────────────────────────────────┘
#
# WHEN DOES THIS PIPELINE RUN?
#   - On every push to ANY branch (catches issues early)
#   - On every Pull Request targeting `main` (blocks bad merges)
#
# WHAT HAPPENS IF IT FAILS?
#   - GitHub marks the PR with a red ✗
#   - Merging is blocked (protected branch rule)
#   - The author gets an email with the exact failure reason
#   - No human needs to manually review basic quality — the machine does it
#
# =============================================================================

name: "🔄 Continuous Integration"

on:
  push:
    branches: ["**"]        # Run on ALL branches (catch issues early)
  pull_request:
    branches: ["main"]      # Block merges to main if this fails

# Cancel in-progress runs when a new commit is pushed to the same branch.
# WHY: If you push 3 commits quickly, you don't want 3 simultaneous pipeline runs.
# This saves CI minutes and gives you faster feedback on the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: LINT
  # Catch style and syntax errors BEFORE running tests.
  # WHY LINT FIRST? If the code has syntax errors, tests will fail for
  # the wrong reason. Lint gives a cleaner, faster failure signal.
  # ─────────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint (flake8)"
    runs-on: ubuntu-latest   # WHY ubuntu-latest? Standardised, free, widely used.

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4
        # WHY: The runner starts as an empty VM. We need to download the code.

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # WHY cache: Caches pip downloads between runs. Speeds up CI by ~30s.
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: "📦 Install linting dependencies"
        run: pip install flake8 flake8-bugbear
        # WHY: Only install what lint needs. Tests install the full dev deps.

      - name: "🔍 Run flake8"
        run: |
          echo "Running flake8 linter..."
          flake8 app/ run.py
          echo "✅ Lint passed!"
        # If flake8 exits with code 1, this step fails → job fails → PR blocked.

  # ─────────────────────────────────────────────────────────
  # JOB 2: TEST
  # Run the full test suite and enforce coverage threshold.
  # This job depends on lint — if lint fails, we skip tests.
  # ─────────────────────────────────────────────────────────
  test:
    name: "🧪 Test & Coverage"
    runs-on: ubuntu-latest
    needs: [lint]  # Only run tests if lint passes — saves CI minutes on bad code

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: "📦 Install all dependencies"
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: "🧪 Run pytest with coverage"
        run: |
          echo "Running test suite..."
          pytest
          # pytest reads pyproject.toml which includes:
          #   --cov=app              (measure coverage)
          #   --cov-fail-under=80   (fail if < 80%)
          #   --cov-report=html     (generate report)

      - name: "📊 Upload coverage report as artifact"
        # WHY: Engineers can download and view the HTML coverage report
        # directly from the GitHub Actions UI without re-running tests locally.
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if tests fail (so you can see what wasn't covered)
        with:
          name: coverage-report-${{ github.sha }}
          path: htmlcov/
          retention-days: 14  # Keep for 2 weeks, then auto-delete

  # ─────────────────────────────────────────────────────────
  # JOB 3: BUILD DOCKER IMAGE
  # Verify the Dockerfile builds successfully.
  # WHY: A broken Dockerfile would make CD fail. Catching it in CI
  # (on a PR) is much better than discovering it post-merge.
  # ─────────────────────────────────────────────────────────
  build:
    name: "🐳 Build Docker Image"
    runs-on: ubuntu-latest
    needs: [test]  # Only build if tests pass — no point building broken code

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🐳 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
        # WHY: Buildx supports advanced features like caching and multi-platform builds.

      - name: "🏗️ Build Docker image"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false          # CI only builds — CD pushes to registry
          tags: ci-cd-demo:${{ github.sha }}
          cache-from: type=gha  # Use GitHub Actions cache to speed up builds
          cache-to: type=gha,mode=max

      - name: "✅ Confirm build succeeded"
        run: echo "Docker image built successfully with tag ci-cd-demo:${{ github.sha }}"

  # ─────────────────────────────────────────────────────────
  # JOB 4: SECURITY SCAN
  # Scan dependencies and the Docker image for known vulnerabilities.
  #
  # WHY: A package you installed 6 months ago may have a CVE published today.
  # Security scanning in CI means you're notified about vulnerabilities
  # before they reach production — not after an incident.
  # ─────────────────────────────────────────────────────────
  security:
    name: "🔒 Security Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [build]
    # Don't block the pipeline on security warnings (continue-on-error: true)
    # In a production setup, you'd set this to false for CRITICAL findings.

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🔒 Run Trivy vulnerability scanner on filesystem"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "0"          # Don't fail — this is a learning demo
          ignore-unfixed: true    # Only report vulnerabilities with fixes available
          severity: "CRITICAL,HIGH"

  # ─────────────────────────────────────────────────────────
  # JOB 5: CI SUMMARY
  # A final job that only succeeds if ALL previous jobs passed.
  # WHY: GitHub branch protection rules check for a single named job.
  # This "ci-passed" job makes it easy to set one branch protection rule:
  #   "Require 'ci-passed' status check to merge"
  # ─────────────────────────────────────────────────────────
  ci-passed:
    name: "✅ CI Passed"
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: always()  # Run even if previous jobs were skipped

    steps:
      - name: "Check all CI jobs succeeded"
        run: |
          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" ]]; then
            echo "🎉 All CI checks passed! Ready to merge."
          else
            echo "❌ One or more CI checks failed."
            echo "  Lint:  ${{ needs.lint.result }}"
            echo "  Test:  ${{ needs.test.result }}"
            echo "  Build: ${{ needs.build.result }}"
            exit 1
          fi
